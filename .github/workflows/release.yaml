name: Build and Release Executables

on:
  push:
    tags:
      - 'v*' # Se activa al subir etiquetas como v1.0.0, v2.1.3, etc.

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: SqlDiffUI_windows.exe
            pyinstaller_cmd: pyinstaller --onefile --windowed --name="SqlDiffUI_windows" main.py
          - os: ubuntu-latest
            artifact_name: SqlDiffUI_linux
            pyinstaller_cmd: pyinstaller --onefile --windowed --name="SqlDiffUI_linux" main.py

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies with uv
      run: |
        uv pip install --system pyinstaller
        if [ -f pyproject.toml ]; then
          uv pip install --system .
        fi
      shell: bash

    - name: Build Executable with PyInstaller
      run: ${{ matrix.pyinstaller_cmd }}

    - name: Upload Artifacts to Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/${{ matrix.artifact_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
